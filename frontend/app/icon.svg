<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SCALAR">
  <!-- SCALAR: neon blue #00f5ff monogram on #0a0a0f -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0a0a0f" />
  <text
    x="16"
    y="21"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-weight="800"
    font-size="17"
    fill="#00f5ff"
    filter="url(#glow)"
  >
    S
  </text>
</svg>
