[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# VIBE: Do NOT set `chain_id` / `chain` here for Arc Testnet — Foundry pins the executor to that ID
# and broadcast will error with "Chain 5042002 not supported" (unknown in alloy-chains).
# Arc Testnet is still chain id 5042002; your RPC proves it at runtime.

# VIBE: keep remappings explicit for beginner readability
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# VIBE: Named RPC — `forge script ... --rpc-url arc_testnet`
# Alias `rpc_urls` is not used by Foundry; the standard key is `[rpc_endpoints]`.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

# VIBE: Optional override via shell env (e.g. CI secrets)
# arc_testnet = "${ARC_TESTNET_RPC}"

# VIBE: Block explorer API for `forge verify` (Arcscan / compatible)
# VIBE: `chain` key here can pin Foundry’s global `chain` and break broadcast on custom IDs — omit it.
[etherscan]
arc_testnet = { url = "https://testnet.arcscan.app/api", key = "any" }

# SCALAR: `forge build` runs forge-lint by default. Legacy Vibe contracts use camelCase public
# immutables (getter names); fork tests use raw `transfer` on purpose — exclude those style lints.
[lint]
exclude_lints = ["screaming-snake-case-immutable", "erc20-unchecked-transfer"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
